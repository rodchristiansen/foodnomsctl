# Which FoodNoms App Intents the bridge Shortcut wraps.
#
# FoodNoms ships 45 intents. Nine only open UI and are useless headless. Of the
# rest, most are reads that foodnomsctl already answers faster and in more
# detail straight from the store — wrapping GetFoodEntriesIntent would be
# strictly worse than `foodnomsctl day`. So this manifest is deliberately small:
# the writes the local store must never perform itself, plus the two reads the
# local store genuinely cannot answer because they reach FoodNoms' own online
# database and its AI.
#
# `fixed` values are literals baked into the action at build time — required
# enum parameters that have one sensible answer for scripted use. `params` are
# bound at run time from the request dictionary the CLI passes in.
#
# FoodNoms consolidated its logging intents in 2026: LogFoodIntent and
# LogDrinkIntent are gone, replaced by LogIntent with a `type` enum. Actions
# written against the old identifiers render as "Unknown Action" and fail with
# WFActionErrorDomain error 1. LogQuickEntryIntent below is unaffected.
#
# docs/app-intents.md carries what LogIntent actually accepts, why omitting a
# required parameter is correct, and how to read an entity shape back out of the
# Shortcuts library rather than guessing it.
#
# Entity-typed parameters (mealType, foodMeasure, favorite…) are NOT exposed.
# Shortcuts resolves an entity through its own picker UI, which has no headless
# equivalent; binding one from text does not work. That is the honest ceiling of
# this approach and the reason `log` takes a quick entry rather than a library
# item reference.

bundle: com.algebraiclabs.foodnoms
team: 32642VZFU3
shortcut_name: FoodNomsCTL Bridge

commands:
  - command: log
    intent: LogQuickEntryIntent
    summary: Log a food by name with macros
    fixed:
      dateTimePreference: dateAndTime
      uncertainty: exact
      requireMacros: true
    params:
      name: {type: text, required: true}
      # `date` is optional on the intent and was long assumed absent, so every
      # entry landed at "now" and a correction to an earlier day was impossible.
      # It is a Date primitive, not an entity, so it binds from a run-time value
      # like every other field here. `dateTimePreference: dateAndTime` above is
      # what makes the intent honour both halves of what is passed; with the
      # date omitted that same enum simply means now.
      date: {type: text}
      energyCalories: {type: number}
      protein: {type: number}
      carbs: {type: number}
      fat: {type: number}
      fiber: {type: number}
      sugars: {type: number}
      sodium: {type: number}

  - command: create-food
    intent: CreateFoodIntent
    summary: Create a food in the library
    fixed:
      normalizationMode: perServing
      immediatelySave: true
    params:
      name: {type: text, required: true}
      brand: {type: text}
      barcode: {type: text}
      servingSize: {type: text}
      energyCalories: {type: number}
      protein: {type: number}
      carbs: {type: number}
      fat: {type: number}

# SearchFoodnomsDatabaseIntent is absent too, for a different reason that no
# metadata reveals: it presents FoodNoms' food picker and blocks until someone
# chooses. `shortcuts run` never returns. SearchFoodLibraryIntent does the same,
# despite declaring openAppWhenRun: false. An intent that resolves to entities is
# liable to do this — being headless is not something the App Intents metadata
# declares, so the only way to find out is to run it once and watch.
#
# AskFoodnomsAIIntent is deliberately absent. Its required parameters include
# mealType, which is entity-typed, and Shortcuts resolves an entity through
# picker UI — there is no value a generated action can put there. Same for
# LogWeightIntent, whose `weight` is a measurement rather than a primitive and
# needs a magnitude/unit payload this generator does not model yet. Both fail at
# run time, not import time, and Shortcuts validates every action in the
# workflow before running any of them: one unsatisfiable action anywhere makes
# the whole bridge return "Please choose a value for each parameter in this
# action", including for commands that are themselves fine.

  - command: delete
    intent: DeleteLoggedFoodIntent
    summary: Delete a logged entry, by its entry id
    fixed:
      deleteWithoutConfirmation: true
    # KNOWN BROKEN. foodEntries is an entity array, and an entity binds fine
    # from a literal known at build time — that is how the smoothie generator
    # pins a food. It does NOT bind from a value arriving at run time: the
    # intent accepts the request, returns nothing, and deletes nothing, whether
    # the identifier is the entry UUID in either case or its row id.
    #
    # The fix is to stop passing an identifier at all and let Shortcuts produce
    # the entity: GetFoodEntriesIntent for the day, filter it by name inside the
    # shortcut, and hand DeleteLoggedFoodIntent the resulting entity array as a
    # variable. Entity arrays do bind from another action's output.
    #
    # `foodnomsctl delete` reads the store back and fails loudly rather than
    # reporting a success that did not happen.
    entities:
      foodEntries:
        identifier: entryID
        display: entryName
        array: true

  - command: goal
    intent: GetGoalIntent
    summary: Read today's protein goal — the read used to smoke-test the bridge
    # Enum parameters serialize as bare strings, but an entity-backed one like
    # goalTypes needs its whole display payload, not just the value. A bare
    # "allGoals" imports fine and then fails at run time with "Please choose a
    # value for each parameter in this action" — the editor cannot render a
    # half-specified entity, so it treats it as unset.
    fixed:
      scope: goal
      dayOption: today
      goalTypes:
        identifier: protein
        value: protein
        title: {key: Protein}
        subtitle: {key: Protein}
    params: {}
